[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-lab"
version = "0.1.0"
description = "Dependency-light primitives for AI systems experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "echoralife"}]
keywords = ["ai", "agents", "memory", "retrieval", "embeddings"]

[tool.setuptools.packages.find]
include = ["neural_lab*"]
